<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CosechaFina 26/27</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a1a;color:#fff}

/* LAYOUT — portrait: mapa 1fr, panel 200px fijo */
#app{
  display:grid;width:100vw;height:100vh;height:100dvh;
  grid-template-rows:auto calc(55dvh - 30px) 1fr;
  grid-template-columns:1fr;
  grid-template-areas:"topbar""map""panel";
}
@media (orientation:landscape) and (min-width:600px){
  #app{
    grid-template-rows:auto 1fr;
    grid-template-columns:1fr 320px;
    grid-template-areas:"topbar topbar""map panel";
  }
  #panel{border-top:none !important;border-left:1.5px solid rgba(255,255,255,.1) !important;overflow-y:auto}
}

/* TOPBAR */
#topbar{
  grid-area:topbar;background:#1b5e20;
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px;padding-top:max(9px,env(safe-area-inset-top));
  z-index:1000;position:relative;border-bottom:1.5px solid rgba(255,255,255,.12);
}
#topbar h1{font-size:15px;font-weight:700;color:#fff}
#topbar-sub{font-size:10px;color:#a5d6a7;margin-top:1px}
#topbar-right{display:flex;align-items:center;gap:7px}
#gps-badge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:20px;padding:5px 10px;cursor:pointer;border:1px solid rgba(255,255,255,.15);font-size:11px;color:#fff}
#gps-dot{width:8px;height:8px;border-radius:50%;background:#69f0ae;flex-shrink:0}
#gps-dot.searching{animation:blink 1s infinite}
#gps-dot.sim{background:#ffb300}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
#net-badge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:20px;padding:5px 10px;border:1px solid rgba(255,255,255,.15);font-size:11px;color:#fff}
#net-dot{width:7px;height:7px;border-radius:50%;background:#69f0ae}
#net-dot.offline{background:#ef5350}

/* MAPA */
#map{grid-area:map;z-index:0;position:relative}
#coords-float{position:absolute;bottom:8px;left:8px;z-index:500;background:rgba(0,0,0,.62);color:#e0f2f1;font-family:monospace;font-size:11px;padding:5px 10px;border-radius:10px;pointer-events:none;border:1px solid rgba(255,255,255,.1)}
#offline-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(183,28,28,.88);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;display:none;white-space:nowrap}
#tiff-progress{position:absolute;inset:0;z-index:400;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#tiff-progress.show{display:flex}
#tiff-progress-txt{color:#fff;font-size:13px;font-weight:600}
#tiff-bar{width:220px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
#tiff-fill{height:100%;background:#69f0ae;width:0%;transition:width .2s}

/* PANEL */
#panel{
  grid-area:panel;background:#1e1e1e;
  border-top:1.5px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
  padding-bottom:env(safe-area-inset-bottom,0);
}

/* STATUS */
#status{padding:5px 13px;font-size:11px;color:#aaa;min-height:24px;line-height:1.4;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
#status b{color:#69f0ae}

/* CHIPS */
#cat-row{display:flex;gap:5px;padding:6px 11px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
#cat-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1.5px solid rgba(255,255,255,.15);font-size:11px;font-weight:600;background:rgba(255,255,255,.05);color:#ccc;cursor:pointer;transition:all .12s;user-select:none}
.chip.selected{border-color:var(--c);background:var(--c);color:#fff}
.chip:active{transform:scale(.93)}

/* BOTÓN DESELECCIONAR */
#btn-desel{
  flex-shrink:0;padding:5px 10px;border-radius:20px;
  border:1.5px solid rgba(239,83,80,.4);
  font-size:11px;font-weight:700;
  background:rgba(239,83,80,.12);color:#ef9a9a;
  cursor:pointer;transition:all .12s;user-select:none;
  display:none;
}
#btn-desel:active{transform:scale(.93);background:rgba(239,83,80,.3)}

/* ACCIONES */
#actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 11px;flex-shrink:0}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:11px;border:none;cursor:pointer;font-size:10px;font-weight:700;line-height:1.2;transition:all .12s;user-select:none;-webkit-user-select:none}
.abtn svg{width:21px;height:21px;flex-shrink:0}
.abtn:active{transform:scale(.92)}
#btn-voice{background:#0d3c6e;color:#90caf9;border:1.5px solid #1565c0}
#btn-voice.rec{background:#7f0000;color:#ef9a9a;border-color:#c62828;animation:recpulse .7s infinite}
#btn-gps{background:#1b3a1f;color:#a5d6a7;border:1.5px solid #2e7d32}
#btn-photo{background:#3e2000;color:#ffcc80;border:1.5px solid #e65100}
#btn-tiff{background:#1a237e;color:#90caf9;border:1.5px solid #283593}
#btn-tiff.loaded{background:#0d3320;color:#69f0ae;border-color:#2e7d32}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.55}}

/* RASTER BAR */
#raster-bar{display:none;flex-shrink:0;background:#0d1f0d;border-bottom:1px solid rgba(105,240,174,.15);padding:4px 13px;font-size:10px;color:#69f0ae;align-items:center;gap:8px}
#clear-raster{margin-left:auto;background:none;border:none;color:#ef5350;font-size:11px;font-weight:700;cursor:pointer}

/* WAYPOINTS */
#wp-section{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#wp-header{display:flex;justify-content:space-between;align-items:center;padding:5px 13px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
#wp-header-left{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.07em}
.exp-btns{display:flex;gap:5px}
.exp-btn{font-size:10px;padding:4px 9px;border-radius:8px;border:none;cursor:pointer;font-weight:700;background:rgba(46,125,50,.2);color:#a5d6a7;border:1px solid rgba(46,125,50,.35)}
#wp-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.wp-row{display:flex;align-items:center;gap:8px;padding:6px 13px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .1s}
.wp-row:active{background:rgba(255,255,255,.05)}
.wp-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.wp-info{flex:1;min-width:0}
.wp-name{font-size:12px;font-weight:600;color:#e0e0e0}
.wp-meta{font-size:9.5px;color:#555;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-src{font-size:9px;color:#444}
.wp-thumb{width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.wp-del{background:rgba(183,28,28,.15);border:1px solid rgba(183,28,28,.3);color:#ef9a9a;font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;cursor:pointer;flex-shrink:0}
.wp-del:active{background:rgba(183,28,28,.4)}
.empty-wp{padding:16px;font-size:12px;color:#444;text-align:center;font-style:italic}

/* VOICE TOAST */
#voice-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;border-radius:20px;padding:13px 24px;font-size:14px;font-weight:600;display:none;z-index:9999;text-align:center;max-width:85vw;pointer-events:none;border:1px solid rgba(255,255,255,.15)}

/* LEAFLET OVERRIDES */
.leaflet-control-zoom{border:none !important}
.leaflet-control-zoom a{background:#1e1e1e !important;color:#69f0ae !important;border:1px solid rgba(255,255,255,.15) !important;font-weight:700;width:34px !important;height:34px !important;line-height:34px !important;font-size:17px !important}
.leaflet-control-layers{background:#1e1e1e !important;border:1px solid rgba(255,255,255,.15) !important;border-radius:10px !important;color:#ccc !important;font-size:12px !important}
.leaflet-control-layers-toggle{background-color:#1e1e1e !important;border:1px solid rgba(255,255,255,.2) !important;border-radius:8px !important}
.leaflet-control-attribution{font-size:8px !important;background:rgba(0,0,0,.4) !important;color:#555 !important}
.leaflet-popup-content-wrapper{border-radius:12px !important;padding:0 !important;overflow:hidden;background:#1e1e1e !important;box-shadow:0 4px 20px rgba(0,0,0,.5) !important;border:1px solid rgba(255,255,255,.12) !important}
.leaflet-popup-content{margin:0 !important;min-width:190px}
.leaflet-popup-tip{background:#1e1e1e !important}
.leaflet-popup-close-button{color:#fff !important;font-size:17px !important;top:7px !important;right:9px !important}
.wp-popup{padding:11px 13px}
.wp-popup-title{font-size:13px;font-weight:700;margin-bottom:3px}
.wp-popup-coords{font-size:10px;font-family:monospace;color:#777;margin-bottom:2px}
.wp-popup-time{font-size:10px;color:#555;margin-bottom:7px}
.wp-popup-img{width:100%;max-height:120px;object-fit:cover;border-radius:7px;margin-bottom:7px;cursor:pointer;display:block}
.wp-popup-del{width:100%;background:rgba(183,28,28,.2);border:1px solid rgba(183,28,28,.4);color:#ef9a9a;padding:7px;font-size:12px;font-weight:700;cursor:pointer;border-radius:7px}

/* CAPA VECTORIAL */
#shp-row{display:flex;align-items:center;gap:6px;padding:5px 11px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
#shp-btn{flex-shrink:0;padding:7px 10px;border-radius:10px;border:1.5px solid #283593;background:#1a237e;color:#90caf9;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
#shp-btn.loaded{background:#0d3320;color:#69f0ae;border-color:#2e7d32}
#shp-name{flex:1;font-size:10.5px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#shp-toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;background:#333;position:relative;flex-shrink:0;transition:background .2s;display:none}
#shp-toggle.on{background:#2e7d32}
#shp-toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
#shp-toggle.on::after{left:19px}
#shp-del{background:none;border:none;color:#555;font-size:16px;cursor:pointer;flex-shrink:0;padding:0 2px;display:none}
#shp-del:active{color:#ef9a9a}

/* PHOTO MODAL */
#photo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9998;align-items:center;justify-content:center}
#photo-modal.show{display:flex}
#photo-modal img{max-width:94vw;max-height:86vh;border-radius:10px;object-fit:contain}
#photo-modal-close{position:absolute;top:15px;right:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:36px;height:36px;font-size:19px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div>
      <div style="display:flex;align-items:center;gap:7px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#69f0ae" stroke-width="2.2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <h1>CosechaFina 26/27</h1>
      </div>
      <div id="topbar-sub">Cereales y oleaginosas de invierno</div>
    </div>
    <div id="topbar-right">
      <div id="net-badge"><div id="net-dot"></div><span id="net-txt">Online</span></div>
      <div id="gps-badge" onclick="centerOnGPS()"><div id="gps-dot" class="searching"></div><span id="gps-txt">GPS...</span></div>
    </div>
  </div>

  <div id="map">
    <div id="coords-float">Lat <b id="lat-v">--</b> &nbsp; Lon <b id="lon-v">--</b> &nbsp; ±<b id="acc-v">--</b>m</div>
    <div id="offline-banner">⚠ Sin conexión — tiles no disponibles</div>
    <div id="tiff-progress">
      <div id="tiff-progress-txt">Leyendo GeoTIFF...</div>
      <div id="tiff-bar"><div id="tiff-fill"></div></div>
    </div>
  </div>

  <div id="panel">
    <div id="status">Seleccioná una cobertura, luego tocá el mapa o usá GPS/voz.</div>

    <!-- CHIPS + DESELECCIONAR -->
    <div id="cat-row">
      <button id="btn-desel" onclick="deseleccionar()">✕ Quitar</button>
    </div>

    <!-- ACCIONES -->
    <div id="actions">
      <button class="abtn" id="btn-voice" onclick="toggleVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span id="voice-lbl">Voz</span>
      </button>
      <button class="abtn" id="btn-gps" onclick="addWaypointGPS()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/></svg>
        Anotar GPS
      </button>
      <button class="abtn" id="btn-tiff" onclick="document.getElementById('tiff-file').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9l4-4 4 4 4-4 4 4"/><path d="M3 15l4-4 4 4 4-4 4 4"/></svg>
        <span id="tiff-lbl">TIFF</span>
      </button>
      <button class="abtn" id="btn-photo" onclick="triggerPhoto()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Foto
      </button>
    </div>

    <div id="raster-bar">
      <span>🛰 <b id="raster-name">—</b></span>
      <span><b id="raster-size">—</b></span>
      <button id="clear-raster" onclick="clearRaster()">✕ Quitar imagen</button>
    </div>

    <!-- CAPA VECTORIAL -->
    <div id="shp-row">
      <button id="shp-btn" onclick="document.getElementById('shp-file').click()">
        🗺 Cargar SHP
      </button>
      <span id="shp-name">Sin capa vectorial</span>
      <button id="shp-toggle" onclick="toggleShp()"></button>
      <button id="shp-del" onclick="removeShp()" title="Quitar capa">✕</button>
      <input type="file" accept=".zip" id="shp-file" style="display:none" onchange="loadShp(event)">
    </div>

    <!-- WAYPOINTS -->
    <div id="wp-section">
      <div id="wp-header">
        <span id="wp-header-left">Waypoints: <span id="wp-count">0</span></span>
        <div class="exp-btns">
          <button class="exp-btn" onclick="fitAllWaypoints()">🔍 Ver todos</button>
          <button class="exp-btn" onclick="exportGeoJSON()">⬇ GeoJSON</button>
          <button class="exp-btn" onclick="exportKMZ()">⬇ KMZ</button>
          <button class="exp-btn" id="btn-clear-all" onclick="clearAllWaypoints()" style="background:rgba(183,28,28,.15);color:#ef9a9a;border-color:rgba(183,28,28,.35)">🗑 Borrar todo</button>
        </div>
      </div>
      <div id="wp-list"><div class="empty-wp">Sin waypoints aún.</div></div>
    </div>
  </div>
</div>

<div id="voice-toast"></div>
<input type="file" accept="image/*" capture="environment" id="photo-file" style="display:none" onchange="handlePhoto(event)">
<input type="file" accept=".tif,.tiff" id="tiff-file" style="display:none" onchange="loadTiff(event)">
<div id="photo-modal">
  <button id="photo-modal-close" onclick="closeModal()">✕</button>
  <img id="modal-img" src="" alt="foto">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<script>
// ── CATEGORÍAS ──────────────────────────────────────────────────────────────
const CATS = [
  {id:'trigo',    label:'Trigo',    color:'#f9a825'},
  {id:'colza',    label:'Colza',    color:'#c6d800'},
  {id:'avena',    label:'Avena',    color:'#bcaaa4'},
  {id:'cebada',   label:'Cebada',   color:'#ffe0b2'},
  {id:'centeno',  label:'Centeno',  color:'#a1887f'},
  {id:'carinata', label:'Carinata', color:'#ff8f00'},
  {id:'camelina', label:'Camelina', color:'#ffe066'},
  {id:'vicia',    label:'Vicia',    color:'#ab47bc'},
  {id:'arveja',   label:'Arveja',   color:'#4caf50'},
  {id:'pasturas', label:'Pasturas', color:'#2e7d32'},
  {id:'natural',  label:'Natural',  color:'#1b5e20'},
  {id:'barbecho', label:'Barbecho', color:'#8d6e63'},
  {id:'verdeo',   label:'Verdeo',   color:'#9ccc65'}
];
const ALIASES = {
  trigo:   ['trigo','trigal'],
  colza:   ['colza','canola'],
  avena:   ['avena'],
  cebada:  ['cebada','cebadal'],
  centeno: ['centeno'],
  carinata:['carinata','karinata','carinatta','karinatta'],
  camelina:['camelina'],
  vicia:   ['vicia','vicia villosa'],
  arveja:  ['arveja','arvejas'],
  pasturas:['pastura','pasturas','pastizal','pasto'],
  natural: ['campo natural','natural','campo'],
  barbecho:['barbecho','rastrojo'],
  verdeo:  ['verdeo','verdeos']
};

// ── STATE ───────────────────────────────────────────────────────────────────
let currentCat = null;
let waypoints = [];
let currentPos = null;
let pendingPhoto = null;
let pendingTapWp = null;
let pendingMarker = null;
let map = null;
let gpsMarker = null;
let gpsCircle = null;
let leafletMarkers = {};
let rasterOverlay = null;
let recognition = null;
let isRec = false;

// ── MAPA ────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', {center:[-34.62,-60.45], zoom:13, zoomControl:true, tap:true, tapTolerance:20});

  const esriSat = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Tiles © Esri · Maxar', maxZoom:19}
  );
  const esriHybrid = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Labels © Esri'})
  ]);
  const esriTopo = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    {attribution:'Tiles © Esri', maxZoom:19}
  );

  esriSat.addTo(map);
  L.control.layers({'🛰 ESRI Satélite':esriSat,'🛰 ESRI Híbrido':esriHybrid,'🏔 ESRI Topográfico':esriTopo},{},{position:'topright',collapsed:true}).addTo(map);
  map.zoomControl.setPosition('bottomright');

  map.on('click', e => {
    if (currentCat) {
      addWaypointAt(e.latlng.lat, e.latlng.lng, 'tap');
    } else {
      setPendingTap(e.latlng.lat, e.latlng.lng);
    }
  });

  map.on('mousemove', e => {
    document.getElementById('lat-v').textContent = e.latlng.lat.toFixed(6);
    document.getElementById('lon-v').textContent = e.latlng.lng.toFixed(6);
  });
}

// ── CATEGORÍAS ──────────────────────────────────────────────────────────────
function buildCats() {
  const row = document.getElementById('cat-row');
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.id = 'chip-' + c.id;
    btn.textContent = c.label;
    btn.style.setProperty('--c', c.color);
    btn.onclick = () => selectCat(c);
    row.appendChild(btn);
  });
}

function selectCat(c) {
  currentCat = c;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('selected'));
  document.getElementById('chip-' + c.id).classList.add('selected');
  document.getElementById('btn-desel').style.display = 'flex';
  // Si hay punto pendiente en el mapa, confirmarlo
  if (pendingTapWp) {
    const {lat, lon} = pendingTapWp;
    clearPendingTap();
    addWaypointAt(lat, lon, 'tap', c);
    return;
  }
  setStatus('Cobertura: <b>' + c.label + '</b>. Tocá el mapa, usá GPS o voz.');
}

function deseleccionar() {
  currentCat = null;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-desel').style.display = 'none';
  setStatus('Sin cobertura activa. Seleccioná una o tocá el mapa para marcar un punto pendiente.');
}

// ── PUNTO PENDIENTE (tocado sin categoría) ──────────────────────────────────
function setPendingTap(lat, lon) {
  clearPendingTap();
  pendingTapWp = {lat, lon};
  const icon = L.divIcon({
    className:'',
    html:`<div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:3px dashed #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:15px;animation:pp 1s infinite">?</div><style>@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}</style>`,
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-18]
  });
  pendingMarker = L.marker([lat,lon],{icon,zIndexOffset:2000}).addTo(map);
  setStatus('📍 Punto marcado · <b>' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</b> — ahora elegí la cobertura o dictá por voz.');
}

function clearPendingTap() {
  if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
  pendingTapWp = null;
}

// ── WAYPOINTS ───────────────────────────────────────────────────────────────
function addWaypointGPS() {
  if (!currentPos) { setStatus('⚠ Sin GPS aún.'); return; }
  if (!currentCat) { setStatus('⚠ Seleccioná una cobertura primero.'); return; }
  addWaypointAt(currentPos.lat, currentPos.lon, 'gps');
}

function addWaypointAt(lat, lon, source, catOverride) {
  const cat = catOverride || currentCat;
  if (!cat) return;
  const wp = {
    id:Date.now(), lat, lon,
    acc: source==='gps' ? (currentPos?currentPos.acc:0) : 0,
    cat:cat.id, label:cat.label, color:cat.color,
    time:new Date().toISOString(), source, photoData:null
  };
  if (pendingPhoto) { wp.photoData = pendingPhoto; pendingPhoto = null; }
  waypoints.push(wp);
  addLeafletMarker(wp);
  updateWpCount();
  renderList();
  saveLocal();
  const srcLbl = {gps:'GPS',tap:'mapa',voz:'voz'}[source]||source;
  setStatus('✓ <b>#'+waypoints.length+' '+cat.label+'</b> · '+srcLbl+' · '+lat.toFixed(5)+', '+lon.toFixed(5));
  if (navigator.vibrate) navigator.vibrate([50,30,100]);
}

function addLeafletMarker(wp) {
  const idx = waypoints.indexOf(wp)+1;
  const icon = L.divIcon({
    className:'',
    html:`<div style="width:30px;height:30px;border-radius:50%;background:${wp.color};border:3px solid rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;font-family:sans-serif;">${idx}</div>`,
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-18]
  });
  const marker = L.marker([wp.lat,wp.lon],{icon}).addTo(map).bindPopup(buildPopup(wp,idx),{maxWidth:230,minWidth:190});
  leafletMarkers[wp.id] = marker;
}

function buildPopup(wp, idx) {
  return `<div class="wp-popup">
    <div class="wp-popup-title" style="color:${wp.color}">#${idx} ${wp.label}</div>
    <div class="wp-popup-coords">${wp.lat.toFixed(7)}, ${wp.lon.toFixed(7)}</div>
    <div class="wp-popup-time">${wpSrcIcon(wp.source)} ${wp.source}${wp.acc?' · ±'+wp.acc+'m':''} · ${wp.time.slice(11,19)}</div>
    ${wp.photoData?`<img class="wp-popup-img" src="${wp.photoData}" onclick="openModal(${wp.id})">`:``}
    <button class="wp-popup-del" onclick="deleteWp(${wp.id})">🗑 Eliminar este punto</button>
  </div>`;
}

function deleteWp(id) {
  map.closePopup();
  if (leafletMarkers[id]) { map.removeLayer(leafletMarkers[id]); delete leafletMarkers[id]; }
  waypoints = waypoints.filter(w => w.id !== id);
  rebuildMarkers();
  updateWpCount(); renderList(); saveLocal();
}

function rebuildMarkers() {
  Object.values(leafletMarkers).forEach(m => map.removeLayer(m));
  leafletMarkers = {};
  waypoints.forEach(wp => addLeafletMarker(wp));
}

function updateWpCount() { document.getElementById('wp-count').textContent = waypoints.length; }

function renderList() {
  const list = document.getElementById('wp-list');
  if (!waypoints.length) { list.innerHTML='<div class="empty-wp">Sin waypoints aún.</div>'; return; }
  list.innerHTML = '';
  [...waypoints].reverse().forEach((wp,ri) => {
    const i = waypoints.length-1-ri;
    const d = document.createElement('div');
    d.className = 'wp-row';
    d.onclick = () => flyTo(wp.id);
    d.innerHTML = `
      <div class="wp-dot" style="background:${wp.color}"></div>
      <div class="wp-info">
        <div class="wp-name">#${i+1} ${wp.label}</div>
        <div class="wp-meta">${wp.lat.toFixed(6)}, ${wp.lon.toFixed(6)} · ${wp.time.slice(11,19)}</div>
        <div class="wp-src">${wpSrcIcon(wp.source)} ${wp.source}${wp.acc?' · ±'+wp.acc+'m':''}</div>
      </div>
      ${wp.photoData?`<img class="wp-thumb" src="${wp.photoData}" onclick="event.stopPropagation();openModal(${wp.id})">`:``}
      <button class="wp-del" onclick="event.stopPropagation();deleteWp(${wp.id})">🗑</button>
    `;
    list.appendChild(d);
  });
}

function flyTo(id) {
  const wp = waypoints.find(w => w.id===id); if (!wp) return;
  map.flyTo([wp.lat,wp.lon],16,{duration:.8});
  setTimeout(()=>{ if(leafletMarkers[id]) leafletMarkers[id].openPopup(); },900);
}

function fitAllWaypoints() {
  if (!waypoints.length) { setStatus('⚠ No hay waypoints anotados aún.'); return; }
  if (waypoints.length===1) { map.flyTo([waypoints[0].lat,waypoints[0].lon],15,{duration:.8}); return; }
  const lats=waypoints.map(w=>w.lat), lons=waypoints.map(w=>w.lon);
  map.flyToBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[40,40],maxZoom:17,duration:1});
  setStatus('Mostrando todos los waypoints (' + waypoints.length + ').');
}

function wpSrcIcon(s) { return s==='gps'?'📡':s==='tap'?'👆':s==='voz'?'🎙':'⊙'; }

// ── VOZ ─────────────────────────────────────────────────────────────────────
function toggleVoice() { isRec ? stopVoice() : startVoice(); }

function startVoice() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) { setStatus('⚠ Reconocimiento de voz no disponible. Usá Chrome.'); return; }
  recognition = new SR();
  recognition.lang = 'es-AR'; recognition.continuous = false;
  recognition.interimResults = true; recognition.maxAlternatives = 3;
  recognition.onstart = () => {
    isRec=true;
    document.getElementById('btn-voice').classList.add('rec');
    document.getElementById('voice-lbl').textContent='Escuchando...';
    showToast('🎙 Decí el cultivo...');
    setStatus('🎙 Escuchando — trigo, colza, avena, cebada, vicia...');
  };
  recognition.onresult = e => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      if (e.results[i].isFinal) { processVoice(e.results[i][0].transcript.toLowerCase().trim()); }
      else interim += e.results[i][0].transcript;
    }
    if (interim) showToast('🎙 '+interim);
  };
  recognition.onerror = e => {
    const m={'not-allowed':'Permiso de micrófono denegado.','no-speech':'No escuché nada.','network':'Sin conexión para voz.'};
    setStatus('⚠ '+(m[e.error]||'Error: '+e.error)); stopVoice();
  };
  recognition.onend = stopVoice;
  recognition.start();
}

function stopVoice() {
  isRec=false;
  if(recognition) try{recognition.stop();}catch(e){}
  document.getElementById('btn-voice').classList.remove('rec');
  document.getElementById('voice-lbl').textContent='Voz';
  setTimeout(hideToast,2500);
}

function processVoice(texto) {
  for (const [catId,words] of Object.entries(ALIASES)) {
    if (words.some(w=>texto.includes(w))) {
      const cat = CATS.find(c=>c.id===catId);
      currentCat = cat;
      document.querySelectorAll('.chip').forEach(b=>b.classList.remove('selected'));
      document.getElementById('chip-'+cat.id).classList.add('selected');
      document.getElementById('btn-desel').style.display='flex';
      if (pendingTapWp) {
        const {lat,lon}=pendingTapWp; clearPendingTap();
        addWaypointAt(lat,lon,'voz',cat);
        showToast('✓ '+cat.label+' — punto del mapa confirmado');
      } else {
        const lat=currentPos?currentPos.lat:map.getCenter().lat;
        const lon=currentPos?currentPos.lon:map.getCenter().lng;
        addWaypointAt(lat,lon,currentPos?'voz':'voz',cat);
        showToast('✓ '+cat.label+' anotado');
      }
      return;
    }
  }
  setStatus('No reconocí "'+texto+'". Probá: trigo, colza, cebada, vicia...');
  showToast('No reconocido: "'+texto+'"');
}

function showToast(msg){const t=document.getElementById('voice-toast');t.textContent=msg;t.style.display='block';}
function hideToast(){document.getElementById('voice-toast').style.display='none';}

// ── GPS ─────────────────────────────────────────────────────────────────────
function initGPS() {
  if (!navigator.geolocation) { startSim(); return; }
  navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat,longitude:lon,accuracy:acc}=pos.coords;
    currentPos={lat,lon,acc:Math.round(acc)};
    document.getElementById('lat-v').textContent=lat.toFixed(6);
    document.getElementById('lon-v').textContent=lon.toFixed(6);
    document.getElementById('acc-v').textContent=Math.round(acc);
    document.getElementById('gps-dot').className='ok';
    document.getElementById('gps-txt').textContent='±'+Math.round(acc)+'m';
    updateGPSMarker(lat,lon,acc);
  },()=>{
    document.getElementById('gps-dot').className='sim';
    document.getElementById('gps-txt').textContent='Sin GPS·Demo';
    startSim();
  },{enableHighAccuracy:true,maximumAge:2000,timeout:12000});
}

function updateGPSMarker(lat,lon,acc) {
  const icon=L.divIcon({className:'',html:`<div style="width:16px;height:16px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 3px rgba(30,136,229,.3)"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
  if (!gpsMarker) {
    gpsMarker=L.marker([lat,lon],{icon,zIndexOffset:1000}).addTo(map);
    gpsCircle=L.circle([lat,lon],{radius:acc,color:'#1e88e5',fillColor:'#1e88e5',fillOpacity:.08,weight:1}).addTo(map);
    map.setView([lat,lon],14);
  } else { gpsMarker.setLatLng([lat,lon]); gpsCircle.setLatLng([lat,lon]); gpsCircle.setRadius(acc); }
}

function centerOnGPS(){if(currentPos)map.flyTo([currentPos.lat,currentPos.lon],15,{duration:.6});}

let simStep=0;
function startSim(){
  const bLat=-34.62+Math.random()*.03, bLon=-60.45+Math.random()*.04;
  updateGPSMarker(bLat,bLon,8); map.setView([bLat,bLon],14);
  setInterval(()=>{
    simStep++;
    const lat=bLat+Math.sin(simStep*.25)*.0018+simStep*.000035;
    const lon=bLon+simStep*.00009;
    currentPos={lat,lon,acc:5};
    document.getElementById('lat-v').textContent=lat.toFixed(6);
    document.getElementById('lon-v').textContent=lon.toFixed(6);
    document.getElementById('acc-v').textContent=5;
    updateGPSMarker(lat,lon,5);
  },2500);
}

// ── FOTO ─────────────────────────────────────────────────────────────────────
function triggerPhoto(){document.getElementById('photo-file').click();}
function handlePhoto(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const data=ev.target.result;
    const last=waypoints[waypoints.length-1];

      renderList(); saveLocal();

    } else { pendingPhoto=data; setStatus('📷 Foto guardada — se adjuntará al próximo waypoint.'); }
  };
  reader.readAsDataURL(file); e.target.value='';
}
function openModal(id){const wp=waypoints.find(w=>w.id==id);if(!wp||!wp.photoData)return;document.getElementById('modal-img').src=wp.photoData;document.getElementById('photo-modal').classList.add('show');}

// ── GEOTIFF ───────────────────────────────────────────────────────────────────
async function loadTiff(e) {
  const file=e.target.files[0]; if(!file)return; e.target.value='';
  showTP('Leyendo archivo...',10);
  try {
    const buf=await file.arrayBuffer();
    showTP('Parseando GeoTIFF...',30);
    const tiff=await GeoTIFF.fromArrayBuffer(buf);
    const image=await tiff.getImage();
    const [minLon,minLat,maxLon,maxLat]=image.getBoundingBox();
    const W=image.getWidth(), H=image.getHeight();
    showTP('Leyendo bandas RGB...',55);
    const samples=await image.readRasters({interleave:true});
    const bands=image.getSamplesPerPixel();
    showTP('Renderizando...',78);
    const off=new OffscreenCanvas(W,H);
    const octx=off.getContext('2d');
    const img=octx.createImageData(W,H);
    const d=img.data;
    for(let i=0;i<W*H;i++){const s=i*bands,t=i*4;d[t]=samples[s];d[t+1]=samples[s+1];d[t+2]=samples[s+2];d[t+3]=bands===4?samples[s+3]:255;}
    octx.putImageData(img,0,0);
    showTP('Agregando al mapa...',92);
    const blob=await off.convertToBlob({type:'image/png'});
    if(rasterOverlay){map.removeLayer(rasterOverlay);}
    rasterOverlay=L.imageOverlay(URL.createObjectURL(blob),[[minLat,minLon],[maxLat,maxLon]],{opacity:1}).addTo(map);
    map.fitBounds([[minLat,minLon],[maxLat,maxLon]],{padding:[20,20]});
    document.getElementById('raster-name').textContent=file.name;
    document.getElementById('raster-size').textContent=W+'×'+H+' px';
    document.getElementById('raster-bar').style.display='flex';
    document.getElementById('btn-tiff').classList.add('loaded');
    document.getElementById('tiff-lbl').textContent='TIFF ✓';
    hideTP();
    setStatus('✓ GeoTIFF cargado — '+file.name+' ('+W+'×'+H+' px)');
  } catch(err) { hideTP(); setStatus('⚠ Error: '+err.message); console.error(err); }
}
function clearRaster(){if(rasterOverlay){map.removeLayer(rasterOverlay);rasterOverlay=null;}document.getElementById('raster-bar').style.display='none';document.getElementById('btn-tiff').classList.remove('loaded');document.getElementById('tiff-lbl').textContent='TIFF';}
function showTP(msg,pct){document.getElementById('tiff-progress').classList.add('show');document.getElementById('tiff-progress-txt').textContent=msg;document.getElementById('tiff-fill').style.width=pct+'%';}
function hideTP(){document.getElementById('tiff-progress').classList.remove('show');document.getElementById('tiff-fill').style.width='0%';}

function exportGeoJSON(){
  if(!waypoints.length){setStatus('No hay waypoints.');return;}
  const geo={type:'FeatureCollection',name:'CosechaFina_2627_'+new Date().toISOString().slice(0,10),crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},features:waypoints.map((wp,i)=>({type:'Feature',geometry:{type:'Point',coordinates:[+wp.lon.toFixed(7),+wp.lat.toFixed(7)]},properties:{id:i+1,categoria:wp.cat,etiqueta:wp.label,fuente:wp.source,precision_m:wp.acc||null,fecha_hora:wp.time,tiene_foto:!!wp.photoData}}))};
  dlBlob(JSON.stringify(geo,null,2),'application/geo+json','CosechaFina_2627_'+new Date().toISOString().slice(0,10)+'.geojson');
  setStatus('✓ GeoJSON exportado — '+waypoints.length+' waypoints.');
}
async function exportKMZ(){
  if(!waypoints.length){setStatus('No hay waypoints para exportar.');return;}
  setStatus('Generando KMZ...');

  const zip = new JSZip();
  const imgFolder = zip.folder('images');
  const fecha = new Date().toISOString().slice(0,10);

  // Estilos de color por categoría
  const stylesDefs = CATS.map(c=>{
    const hex = c.color.replace('#','');
    // KML usa AABBGGRR
    const r=hex.slice(0,2), g=hex.slice(2,4), b=hex.slice(4,6);
    return `<Style id="style_${c.id}">
      <IconStyle>
        <color>ff${b}${g}${r}</color>
        <scale>1.1</scale>
        <Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon>
      </IconStyle>
      <LabelStyle><scale>0.85</scale></LabelStyle>
      <BalloonStyle>
        <text><![CDATA[$[description]]]></text>
      </BalloonStyle>
    </Style>`;
  }).join('\n');

  // Placemarks
  const placemarks = await Promise.all(waypoints.map(async (wp,i)=>{
    let photoTag = '';
    let imgRef = '';

    if(wp.photoData && wp.photoData.startsWith('data:image')){
      // Extraer base64 y guardar como archivo dentro del KMZ
      const mime = wp.photoData.split(';')[0].split(':')[1];
      const ext  = mime === 'image/png' ? 'png' : 'jpg';
      const b64  = wp.photoData.split(',')[1];
      const fname = `wp_${i+1}_${wp.cat}.${ext}`;
      imgFolder.file(fname, b64, {base64:true});
      photoTag = `<img src="images/${fname}" style="max-width:280px;border-radius:8px;margin-top:8px;display:block">`;
    }

    const desc = `<![CDATA[
      <div style="font-family:sans-serif;font-size:13px">
        <b style="font-size:15px;color:${wp.color}">${wp.label}</b><br>
        <span style="color:#888">Fuente: ${wp.source}${wp.acc?' · ±'+wp.acc+'m':''}</span><br>
        <span style="color:#888">${wp.time.replace('T',' ').slice(0,19)}</span><br>
        <span style="font-family:monospace;font-size:11px">${wp.lat.toFixed(7)}, ${wp.lon.toFixed(7)}</span>
        ${photoTag}
      </div>
    ]]>`;

    return `<Placemark>
      <name>#${i+1} ${wp.label}</name>
      <description>${desc}</description>
      <styleUrl>#style_${wp.cat}</styleUrl>
      <TimeStamp><when>${wp.time}</when></TimeStamp>
      <Point>
        <altitudeMode>clampToGround</altitudeMode>
        <coordinates>${wp.lon.toFixed(7)},${wp.lat.toFixed(7)},0</coordinates>
      </Point>
    </Placemark>`;
  }));

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>CosechaFina_2627_${fecha}</name>
  <description>Relevamiento Campaña Cosecha Fina 2026/2027 — ${waypoints.length} waypoints</description>
  ${stylesDefs}
  ${placemarks.join('\n')}
</Document>
</kml>`;

  zip.file('doc.kml', kml);

  const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
  dlBlob(blob, 'application/vnd.google-earth.kmz', 'CosechaFina_2627_'+fecha+'.kmz');
  setStatus('✓ KMZ exportado — '+waypoints.length+' waypoints'+
    (waypoints.some(w=>w.photoData)?' con fotos incluidas':'')+'. Abrilo en Google Earth.');
}
function dlBlob(content,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}

// ── SHAPEFILE ────────────────────────────────────────────────────────────────
let shpLayer   = null;
let shpVisible = true;

async function loadShp(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  setStatus('Cargando shapefile...');
  try {
    const buf = await file.arrayBuffer();
    const geojson = await shp(buf);
    if(shpLayer) map.removeLayer(shpLayer);
    const gj = Array.isArray(geojson) ? geojson[0] : geojson;
    const firstGeom = gj.features?.[0]?.geometry?.type || '';
    const isPoint = firstGeom.toLowerCase().includes('point');
    shpLayer = L.geoJSON(gj, {
      style: () => ({color:'#ff6b35',weight:1,opacity:.9,fillColor:'transparent',fillOpacity:0}),
      pointToLayer: (f, ll) => L.circleMarker(ll, {radius:7,fillColor:'#ff6b35',color:'#fff',weight:1.5,opacity:1,fillOpacity:.85}),
      onEachFeature: (feature, layer) => {
        if(!feature.properties) return;
        const rows = Object.entries(feature.properties)
          .filter(([k,v]) => v !== null && String(v).trim() !== '')
          .slice(0,8)
          .map(([k,v]) => `<tr><td style="color:#888;padding:2px 5px 2px 0;font-size:11px">${k}</td><td style="font-size:11px;font-weight:600;color:#e0e0e0">${v}</td></tr>`)
          .join('');
        if(rows) layer.bindPopup(
          `<div style="font-family:sans-serif;background:#1e1e1e;color:#e0e0e0;padding:8px;min-width:150px;border-radius:8px">
            <div style="font-size:12px;font-weight:700;color:#ff6b35;margin-bottom:5px">Shapefile</div>
            <table>${rows}</table>
          </div>`,{maxWidth:240}
        );
      }
    }).addTo(map);
    shpVisible = true;
    try{ map.fitBounds(shpLayer.getBounds(),{padding:[30,30]}); }catch(err){}
    let n=0; shpLayer.eachLayer(()=>n++);
    const nombre = file.name.replace('.zip','');
    document.getElementById('shp-name').textContent = nombre + ' · ' + n + ' elem.';
    document.getElementById('shp-btn').classList.add('loaded');
    document.getElementById('shp-btn').textContent = '🗺 SHP ✓';
    document.getElementById('shp-toggle').style.display = 'block';
    document.getElementById('shp-toggle').classList.add('on');
    document.getElementById('shp-del').style.display = 'block';
    setStatus('✓ Shapefile cargado — <b>' + nombre + '</b> · ' + n + ' elementos.');
  } catch(err) {
    setStatus('⚠ Error: ' + err.message + '. Verificá que el ZIP contenga .shp + .dbf en EPSG:4326.');
    console.error(err);
  }
}

function toggleShp(){
  if(!shpLayer) return;
  shpVisible = !shpVisible;
  const tog = document.getElementById('shp-toggle');
  if(shpVisible){ map.addLayer(shpLayer); tog.classList.add('on'); }
  else { map.removeLayer(shpLayer); tog.classList.remove('on'); }
}

function removeShp(){
  if(!shpLayer) return;
  if(!confirm('¿Quitar la capa vectorial?')) return;
  map.removeLayer(shpLayer);
  shpLayer = null; shpVisible = true;
  document.getElementById('shp-name').textContent = 'Sin capa vectorial';
  document.getElementById('shp-btn').classList.remove('loaded');
  document.getElementById('shp-btn').textContent = '🗺 Cargar SHP';
  document.getElementById('shp-toggle').style.display = 'none';
  document.getElementById('shp-toggle').classList.remove('on');
  document.getElementById('shp-del').style.display = 'none';
  setStatus('Capa vectorial eliminada.');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('photo-modal').addEventListener('click',e=>{if(e.target===document.getElementById('photo-modal'))closeModal();});
buildCats();
initMap();
loadLocal();
initGPS();
updateNet();
</script>
